<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PDF RAG Chat</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 720px;
        margin: 40px auto;
      }
      #chat {
        border: 1px solid #ddd;
        border-radius: 12px;
        height: 420px;
        padding: 16px;
        overflow-y: auto;
      }
      .msg {
        margin: 12px 0;
        padding: 10px 14px;
        border-radius: 10px;
        white-space: pre-wrap;
      }
      .user {
        background: #e3f2fd;
        text-align: right;
      }
      .ai {
        background: #f5f5f5;
      }
      .sources {
        font-size: 12px;
        color: #666;
        margin-top: 8px;
      }

      #row {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      #input {
        flex: 1;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #ccc;
      }
      button {
        padding: 10px 18px;
        border-radius: 8px;
        border: none;
        background: #1976d2;
        color: white;
        cursor: pointer;
      }
      .cursor {
        display: inline-block;
        width: 8px;
        height: 16px;
        background: #333;
        animation: blink 1s infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <h2>PDF RAG Chat</h2>
    <div id="chat"></div>
    <div id="row">
      <input id="input" placeholder="Ask about the document..." />
      <button id="send">Send</button>
    </div>
    <script>
      const chatEl = document.getElementById("chat");
      const inputEl = document.getElementById("input");
      const sendBtn = document.getElementById("send");

      function addMessage(text, msgBy) {
        const div = document.createElement("div");
        div.className = "msg " + msgBy;
        div.textContent = text;
        chatEl.appendChild(div);
        return div;
      }

      async function ask(question) {
        addMessage(question, "user");
        const aiDiv = addMessage("", "ai");

        const answer = document.createElement("div");
        answer.className = "answer-text";
        aiDiv.appendChild(answer);

        const cursor = document.createElement("span");
        cursor.className = "cursor";
        answer.appendChild(cursor);

        const response = await fetch("/api/chat/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question }),
        });

        console.log(response);

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        try {
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer = buffer + decoder.decode(value, { stream: true });

            // SSE events are separated by a blank line (\n\n)
            const events = buffer.split("\n\n");
            buffer = events.pop(); // keep the last partial event for next chunk

            for (const evt of events) {
              if (!evt.startsWith("data:")) continue;

              const raw = evt.replace(/^data:\s*/, "").trim();
              if (raw === "[DONE]") break;
              const data = JSON.parse(raw);

              if (data.sources) {
                const s = document.createElement("div");
                s.className = "sources";
                s.textContent =
                  "📚 Sources: " +
                  data.sources
                    .map(
                      (source) =>
                        `chunk ${source.chunk_index} (dist ${source.distance.toFixed(2)})`,
                    )
                    .join(" . ");
                aiDiv.insertBefore(s, answer);
              } else if (data.token) {
                // Inserts text right before the blinking cursor, keeping the cursor at the end!
                cursor.insertAdjacentText("beforebegin", data.token);
              } else if (data.error) {
                cursor.insertAdjacentText("beforebegin", "⚠️ " + data.error);
              }
            }
            chatEl.scrollTop = chatEl.scrollHeight;
          }
        } catch (err) {
          console.error("Stream failed:", err);
          cursor.insertAdjacentText("beforebegin", "⚠️ " + err.message);
        } finally {
          cursor.remove();
        }
      }

      sendBtn.addEventListener("click", () => {
        const question = inputEl.value.trim();
        if (question) {
          inputEl.value = "";
          ask(question);
        }
      });

      inputEl.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          sendBtn.click();
        }
      });
    </script>
  </body>
</html>
